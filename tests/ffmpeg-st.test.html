<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No isolation meta tags: browsers ignore COOP/COEP via <meta> anyway,
         and the ST lane must run WITHOUT cross-origin isolation (serve.js
         --no-coi) — that is the property the single-threaded core exists for. -->
    <title>FFmpeg Unit Test (ST, non-isolated)</title>
    <link rel="stylesheet" href="../node_modules/mocha/mocha.css" />
  </head>
  <body>
    <div id="mocha"></div>
    <script src="../node_modules/mocha/mocha.js"></script>
    <script src="../node_modules/chai/chai.js"></script>
    <script src="../packages/ffmpeg/dist/umd/ffmpeg.js"></script>
    <script src="./test-helper-browser.js"></script>
    <script type="text/javascript">
      window.FFMPEG_TYPE = "st";
      // Origin-relative so the page works on the non-COI port (3001), not
      // just 3000; an absolute :3000 URL would make the core fetch cross-origin.
      window.CORE_URL =
        location.origin + "/packages/core/dist/umd/ffmpeg-core.js";
    </script>
    <script>
      mocha.setup("bdd");
      mocha.timeout(60000);
    </script>
    <script>
      // The load-bearing assertion of the ST lane: the core must work with
      // crossOriginIsolated === false. If this fails, the server sent COOP/COEP
      // and the run proves nothing about the no-isolation deployment target.
      describe("environment", function () {
        it("is NOT cross-origin isolated", function () {
          chai.expect(window.crossOriginIsolated).to.equal(false);
        });
      });
    </script>
    <script src="./ffmpeg.test.js"></script>
    <script>
      window.expect = chai.expect;
      mocha.run();
    </script>
  </body>
</html>
