<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Copy-only ST core as device-under-test; full ST core synthesizes the
         inputs (the copy core has no encoders by design).
         Serve via serve.js --no-coi (port 3001). -->
    <title>Cliptool Vetting (ST copy-only, non-isolated)</title>
    <link rel="stylesheet" href="../node_modules/mocha/mocha.css" />
  </head>
  <body>
    <div id="mocha"></div>
    <script src="../node_modules/mocha/mocha.js"></script>
    <script src="../node_modules/chai/chai.js"></script>
    <script src="../packages/ffmpeg/dist/umd/ffmpeg.js"></script>
    <script src="./test-helper-browser.js"></script>
    <script type="text/javascript">
      window.FFMPEG_TYPE = "st";
      window.SYNTH_CORE_URL =
        location.origin + "/packages/core/dist/umd/ffmpeg-core.js";
      window.CORE_URL =
        location.origin + "/packages/core-copy/dist/umd/ffmpeg-core.js";
      // The copy variant must stay GPL-free (no x264, no --enable-gpl).
      window.EXPECT_GPL_FREE = true;
    </script>
    <script>
      mocha.setup("bdd");
      mocha.timeout(120000);
    </script>
    <script>
      describe("environment", function () {
        it("is NOT cross-origin isolated", function () {
          chai.expect(window.crossOriginIsolated).to.equal(false);
        });
      });
    </script>
    <script src="./ffmpeg-cliptool.test.js"></script>
    <script>
      window.expect = chai.expect;
      mocha.run();
    </script>
  </body>
</html>
